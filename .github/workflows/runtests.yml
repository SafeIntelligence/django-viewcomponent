name: Runs tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  django-current:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        django-version: ['6.0', '6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e . "Django~=${{ matrix.django-version }}.0" pytest pytest-django pytest-mock beautifulsoup4 jinja2
      - name: Run tests
        run: python -m pytest -q

  code-style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Check code style
        run: |
          pre-commit run --all-files

  runtests:
    runs-on: ubuntu-latest
    env:
      CHANNELS_REDIS: redis://localhost:6379/0
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10' ]
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          tox
